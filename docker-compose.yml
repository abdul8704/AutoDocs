version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/node/Dockerfile

    container_name: github-automation

    ports:
      - "5000:5000"

    env_file:
      - .env

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run dev

    restart: unless-stopped